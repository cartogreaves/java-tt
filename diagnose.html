<style>
:root{
  color-scheme:dark;
  --bg:#08090A;--surface:#0F1011;--surface-2:#151618;
  --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.12);
  --text:#EDEEF0;--text-2:#B4B8BF;--muted:#7A7F88;
  --ly6w-100:#C5EB6E;--ly6w-300:#76BE2A;--ly6w-500:#3C7F16;--ly6w-700:#1F4F0C;
  --pearl:linear-gradient(115deg,#1F4F0C 0%,#3C7F16 22%,#76BE2A 45%,#C5EB6E 55%,#76BE2A 66%,#2F6A12 100%);
  --display:"Jost","Futura","Century Gothic",system-ui,sans-serif;
  --sans:"Inter",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(60% 50% at 50% 0%,rgba(118,190,42,.10),transparent 70%)}
.hidden{display:none!important}
.wrap{min-height:100%;display:grid;place-items:center;padding:32px 16px}
.card{width:100%;max-width:380px;padding:32px 28px 26px;border:1px solid var(--line);border-radius:10px;background:var(--surface);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--pearl)}
.brand{display:flex;align-items:center;gap:10px;font:500 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.rings{display:inline-flex}.rings i{width:13px;height:13px;border:1.5px solid var(--text-2);border-radius:50%;margin-left:-5px}.rings i:first-child{margin-left:0}
.cap{display:block;width:84px;height:84px;margin:26px auto 18px}
h1{margin:0;text-align:center;font:500 30px/1.1 var(--display);letter-spacing:-.01em}
.sub{margin:8px 0 24px;text-align:center;color:var(--text-2);font-size:13.5px}
label.f{display:block;font:500 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.pw{position:relative}
.pw input{width:100%;height:46px;padding:0 46px 0 14px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface-2);color:var(--text);font:400 16px var(--sans);outline:0;transition:border-color .15s,box-shadow .15s}
.pw input:focus{border-color:var(--ly6w-300);box-shadow:0 0 0 3px rgba(118,190,42,.18)}
.pw input.bad{border-color:#d66;box-shadow:0 0 0 3px rgba(221,102,102,.15)}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:4px;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.eye:hover{color:var(--text)}
.eye svg{width:18px;height:18px}
.err{min-height:18px;margin:8px 0 0;font-size:12.5px;color:#e88}
.rem{display:flex;align-items:center;gap:9px;margin:10px 0 18px;font-size:13px;color:var(--text-2);cursor:pointer;user-select:none}
.rem input{appearance:none;width:16px;height:16px;margin:0;border:1px solid var(--line-2);border-radius:3px;background:var(--surface-2);display:grid;place-items:center;cursor:pointer}
.rem input:checked{background:var(--ly6w-300);border-color:var(--ly6w-300)}
.rem input:checked::after{content:"";width:8px;height:4px;border:2px solid #08090A;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.go{width:100%;height:46px;border:0;border-radius:6px;background:var(--pearl);background-size:180% 100%;background-position:0 0;color:#08090A;font:600 14px var(--display);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:background-position .4s}
.go:hover,.go:focus-visible{background-position:100% 0;outline:0}
.go:disabled{opacity:.6;cursor:wait}
.foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);text-align:center;font:400 11px/1.5 var(--mono);color:var(--muted)}
.stitch{height:6px;margin-top:14px;background:repeating-linear-gradient(90deg,var(--ly6w-500) 0 6px,transparent 6px 11px);opacity:.55;border-radius:3px}
.spin{width:28px;height:28px;border:2px solid var(--line-2);border-top-color:var(--ly6w-300);border-radius:50%;animation:s 0.8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.shake{animation:shake .35s}

@media (max-width:640px){.eye{width:42px;height:42px;right:2px}.pw input{padding-right:50px}.rem{min-height:40px}}

      <g fill="#4a5058">
        <circle cx="50" cy="8.5" r="2.6"/><circle cx="85.9" cy="29.2" r="2.6"/><circle cx="85.9" cy="70.8" r="2.6"/>
        <circle cx="50" cy="91.5" r="2.6"/><circle cx="14.1" cy="70.8" r="2.6"/><circle cx="14.1" cy="29.2" r="2.6"/>
      </g>
      <circle cx="50" cy="50" r="30" fill="url(#jv)"/>
      <g fill="none" stroke="#08090A" stroke-width="2.4" opacity=".85">
        <circle cx="35.5" cy="50" r="7"/><circle cx="45.2" cy="50" r="7"/><circle cx="54.8" cy="50" r="7"/><circle cx="64.5" cy="50" r="7"/>
      </g>
    </svg>

    <h1>Java TT</h1>
    <p class="sub">Enter the shared password to view the car's history.</p>

      <label class="f" for="staticrypt-password">Password</label>
      <div class="pw">
        <input id="staticrypt-password" type="password" name="password" autocomplete="current-password"

        <button type="button" class="eye" id="eye" aria-label="Show password" title="Show password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <p class="err" id="err" role="alert"></p>

      <label id="staticrypt-remember-label" class="rem hidden">
        <input id="staticrypt-remember" type="checkbox" name="remember" checked>
        Remember me for 30 days
      </label>

      <button type="submit" class="go" id="go">Unlock</button>
    </form>

    <div class="foot">Owner's personal record · not affiliated with Audi AG</div>
    <div class="stitch"></div>
  </div>
</div>
